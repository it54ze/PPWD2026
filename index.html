<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <script>
    (function () {
        try {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) { /* localStorage tidak tersedia, tetap pakai default terang */ }
    })();
</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Saya</title>
    <link rel="stylesheet" href="css/style.css">

        </ul>
        <div class="nav-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="Ganti ke mode gelap" title="Ganti mode gelap/terang">

                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
            </button>
            <button class="nav-toggle" id="navToggle" aria-label="Buka menu navigasi" aria-expanded="false">

    </div>
</nav>
